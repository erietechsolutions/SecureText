# Release pipeline (roadmap Phase 6).
#
# On a version tag (vX.Y.Z) this:
#   1. runs the test suite,
#   2. builds every installer on its own OS (platform-support.md: build
#      installers natively, never cross-compiled),
#   3. installs each one on a fresh runner and checks the app starts,
#   4. creates a DRAFT GitHub Release with the installers and SHA256SUMS.
#
# It deliberately does NOT sign the update manifest. The update-signing key
# never touches GitHub: if it did, anyone who took over the GitHub account
# (or its Actions secrets) could push a malicious update to every user. A
# maintainer publishes the draft with scripts/sign-release.sh, which
# downloads the installers, signs the manifest offline and publishes.
# See docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Create a draft GitHub Release (otherwise just build and test the installers)"
        type: boolean
        default: false
      gui_e2e:
        description: "Also run the two-window GUI test over live Tor (slow)"
        type: boolean
        default: false
      fedora_only:
        description: "Build, test and publish only the Fedora .rpm (quicker test builds)"
        type: boolean
        default: false
      dev_tag:
        description: "Publish a dev build as a GitHub pre-release under this tag (\"auto\" = dev-<run number>). Dev builds update only from later dev builds, via the dev-channel feed"
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Dev builds: channel and version baked into the app (desktop/src/main.rs).
  # Each dev build's version is higher than the last (the run number), so
  # dev installs update from one to the next.
  SECURETEXT_CHANNEL: ${{ inputs.dev_tag != '' && 'dev' || 'stable' }}
  DEV_N: ${{ inputs.dev_tag != '' && github.run_number || '' }}
  DEV_TAG: ${{ inputs.dev_tag == 'auto' && format('dev-{0}', github.run_number) || inputs.dev_tag }}

jobs:
  version:
    name: check version numbers
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          app=$(python3 -c "import json; print(json.load(open('desktop/tauri.conf.json'))['version'])")
          crate=$(grep -m1 '^version' desktop/Cargo.toml | cut -d'"' -f2)
          [ "$app" = "$crate" ] || { echo "tauri.conf.json ($app) and desktop/Cargo.toml ($crate) disagree"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME#v}" = "$app" ] || { echo "tag ${GITHUB_REF_NAME} does not match version $app"; exit 1; }
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  test:
    name: cargo test (${{ matrix.os }})
    needs: version
    strategy:
      matrix:
        os: ${{ fromJSON(inputs.fedora_only && '["ubuntu-22.04"]' || '["ubuntu-22.04", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Audio libraries for calls (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo test --workspace --locked

  build-linux:
    name: build .deb / .AppImage
    if: ${{ !inputs.fedora_only }}
    needs: [version, test]
    # The oldest supported Ubuntu, so the packages' glibc and library
    # dependencies are satisfiable on every supported Ubuntu.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev librsvg2-dev libssl-dev libasound2-dev cmake \
            patchelf file libfuse2 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice
      - name: Packaging tools
        run: cargo install --locked tauri-cli --version "^2" && cargo install --locked cargo-deb
      - name: Desktop installers
        working-directory: desktop
        shell: bash
        run: |
          base=$(python3 -c "import json; print(json.load(open('tauri.conf.json'))['version'])")
          extra=()
          if [ -n "$DEV_N" ]; then
            export SECURETEXT_BUILD_VERSION="$base-dev.$DEV_N"
            extra=(--config "{\"version\":\"$SECURETEXT_BUILD_VERSION\"}")
          fi
          cargo tauri build --bundles deb,appimage "${extra[@]}"
      - name: TURN server
        run: cargo build --release --locked -p securetext-call --bin securetext-turn
      - name: Collect
        run: |
          mkdir -p out
          cp target/release/securetext-turn out/securetext-turn-linux-x86_64
          cp desktop/target/release/bundle/deb/*.deb out/
          cp desktop/target/release/bundle/appimage/*.AppImage out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu
          path: out/*
          if-no-files-found: error

  build-fedora:
    name: build .rpm
    needs: test
    runs-on: ubuntu-22.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: System dependencies
        run: |
          dnf install -y git gcc gcc-c++ make perl python3 pkgconf-pkg-config openssl-devel \
            webkit2gtk4.1-devel libsoup3-devel gtk3-devel librsvg2-devel rpm-build alsa-lib-devel cmake
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - name: Packaging tools
        run: cargo install --locked tauri-cli --version "^2" && cargo install --locked cargo-generate-rpm
      - name: Desktop installer
        working-directory: desktop
        shell: bash
        run: |
          base=$(python3 -c "import json; print(json.load(open('tauri.conf.json'))['version'])")
          extra=()
          if [ -n "$DEV_N" ]; then
            # RPM versions can't hold a pre-release; the release field does
            # (0.dev.N sorts below a full release's 1, and up with N).
            export SECURETEXT_BUILD_VERSION="$base-dev.$DEV_N"
            extra=(--config "{\"bundle\":{\"linux\":{\"rpm\":{\"release\":\"0.dev.$DEV_N\"}}}}")
          fi
          cargo tauri build --bundles rpm "${extra[@]}"
      - name: Collect
        run: |
          mkdir -p out
          cp desktop/target/release/bundle/rpm/*.rpm out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: linux-fedora
          path: out/*
          if-no-files-found: error

  # One static (musl) relay binary, packaged as .deb and .rpm: no glibc or
  # OpenSSL dependency, so the same packages run on every supported relay
  # host (platform-support.md): Ubuntu Server 20.04+, Ubuntu Desktop
  # 22.04+, Debian 13+, Fedora 44+.
  build-relay:
    name: build relay .deb / .rpm (static)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Tools
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo install --locked cargo-deb cargo-generate-rpm
      - run: bash scripts/build-relay-static.sh
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp target/x86_64-unknown-linux-musl/generate-rpm/*.rpm out/
          # Fedora-only builds publish only Fedora packages.
          if [ "${{ inputs.fedora_only }}" != "true" ]; then cp target/x86_64-unknown-linux-musl/debian/*.deb out/; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: relay
          path: out/*
          if-no-files-found: error

  build-windows:
    name: build NSIS .exe / .msi
    if: ${{ !inputs.fedora_only }}
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            desktop
      - name: Packaging tools
        run: cargo install --locked tauri-cli --version "^2"
      - name: Desktop installers
        working-directory: desktop
        shell: bash
        run: |
          base=$(python3 -c "import json; print(json.load(open('tauri.conf.json'))['version'])")
          if [ -n "$DEV_N" ]; then
            # MSI needs purely numeric versions, so dev builds ship NSIS only.
            export SECURETEXT_BUILD_VERSION="$base-dev.$DEV_N"
            cargo tauri build --bundles nsis
          else
            cargo tauri build --bundles nsis,msi
          fi
      # Authenticode signing (so SmartScreen doesn't block the installer)
      # needs a code-signing certificate, which the project doesn't have
      # yet. When it does: store it as WINDOWS_CERTIFICATE (base64 .pfx) and
      # WINDOWS_CERTIFICATE_PASSWORD and sign here with signtool.
      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp desktop/target/release/bundle/nsis/*.exe out/
          if [ -z "$DEV_N" ]; then cp desktop/target/release/bundle/msi/*.msi out/; fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # Install every package on a clean runner and check the app starts.
  # ---------------------------------------------------------------------
  install-ubuntu:
    name: install .deb + AppImage (${{ matrix.os }})
    if: ${{ !inputs.fedora_only }}
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-ubuntu
          path: pkg
      - name: Install the .deb (pulls in its declared dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2t64 || sudo apt-get install -y xvfb libfuse2
          sudo apt-get install -y ./pkg/SecureText_*_amd64.deb
          dpkg -L secure-text
      - name: The installed app starts and stays up
        run: bash packaging/ci/smoke-test.sh /usr/bin/securetext-desktop
      - name: The AppImage starts and stays up
        run: |
          chmod +x pkg/*.AppImage
          bash packaging/ci/smoke-test.sh "$(ls pkg/*.AppImage)"
      - name: Uninstalls cleanly
        run: |
          sudo apt-get remove -y secure-text
          test ! -e /usr/bin/securetext-desktop

  install-fedora:
    name: install .rpm (fedora:44)
    needs: build-fedora
    runs-on: ubuntu-22.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-fedora
          path: pkg
      - name: Install the .rpm (pulls in its declared dependencies)
        run: |
          dnf install -y xorg-x11-server-Xvfb procps-ng
          dnf install -y ./pkg/SecureText-*.x86_64.rpm
          rpm -ql secure-text
          ! ldd /usr/bin/securetext-desktop | grep "not found"
      - name: The installed app starts and stays up
        run: bash packaging/ci/smoke-test.sh /usr/bin/securetext-desktop
      - name: Uninstalls cleanly
        run: |
          dnf remove -y secure-text
          test ! -e /usr/bin/securetext-desktop

  # The relay on every supported relay host: installs, is static, starts,
  # its systemd unit is valid for that host's systemd, uninstalls.
  install-relay:
    name: install relay (${{ matrix.image }})
    needs: build-relay
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.fedora_only && '["registry.fedoraproject.org/fedora:44"]' || '["ubuntu:20.04", "ubuntu:22.04", "ubuntu:24.04", "debian:trixie", "registry.fedoraproject.org/fedora:44"]') }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: relay
          path: pkg
      - name: Install, run, uninstall
        shell: sh
        run: |
          case "${{ matrix.image }}" in
            *fedora*) sh packaging/ci/relay-install-test.sh "$(ls "$PWD"/pkg/securetext-relay-*.x86_64.rpm)" ;;
            *) sh packaging/ci/relay-install-test.sh "$(ls "$PWD"/pkg/securetext-relay_*_amd64.deb)" ;;
          esac

  install-windows:
    name: install NSIS + MSI (windows-latest)
    if: ${{ !inputs.fedora_only }}
    needs: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: pkg
      - name: NSIS installer, per-user, no admin
        shell: pwsh
        run: |
          $exe = Get-ChildItem pkg\*-setup.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          $app = "$env:LOCALAPPDATA\SecureText\securetext-desktop.exe"
          if (-not (Test-Path $app)) { throw "not installed at $app" }
          $p = Start-Process $app -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "the app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id
          Start-Process "$env:LOCALAPPDATA\SecureText\uninstall.exe" -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $app) { throw "uninstall left the app behind" }
      - name: MSI installer
        if: inputs.dev_tag == ''
        shell: pwsh
        run: |
          $msi = Get-ChildItem pkg\*.msi | Select-Object -First 1
          Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart" -Wait
          $app = Get-ChildItem "$env:ProgramFiles\SecureText\securetext-desktop.exe" -ErrorAction Stop
          $p = Start-Process $app.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "the app exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id

  gui-e2e:
    name: two-window GUI test over live Tor
    if: github.event_name == 'workflow_dispatch' && inputs.gui_e2e
    needs: build-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-ubuntu
          path: pkg
      - name: Install the app and WebKitWebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb webkit2gtk-driver ./pkg/SecureText_*_amd64.deb
      - name: Run
        run: |
          export TAURI_WEBVIEW_AUTOMATION=true
          Xvfb :99 -screen 0 1400x900x24 & export DISPLAY=:99
          mkdir -p /tmp/st-e2e && chmod 700 /tmp/st-e2e
          SECURETEXT_PROFILE_DIR=/tmp/st-e2e/alice WebKitWebDriver --port=4444 &
          SECURETEXT_PROFILE_DIR=/tmp/st-e2e/bob WebKitWebDriver --port=4445 &
          sleep 2
          python3 desktop/e2e/gui_e2e.py --binary /usr/bin/securetext-desktop

  draft-release:
    name: draft GitHub Release
    needs: [version, install-ubuntu, install-fedora, install-relay, install-windows]
    # Skipped platforms (fedora_only) don't block it; failures still do.
    if: ${{ !cancelled() && !failure() && (github.ref_type == 'tag' || inputs.draft_release || inputs.dev_tag != '') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the draft
        if: inputs.dev_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "SecureText $VERSION" \
            --notes "Draft built by CI. Not published until a maintainer signs the update manifest (scripts/sign-release.sh)."
      # Dev builds: a published pre-release with no signed update manifest.
      # GitHub never treats a pre-release as "latest", and installed copies
      # only look at releases/latest, so nobody is updated to one.
      - name: Publish the dev pre-release
        if: inputs.dev_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORMS: ${{ inputs.fedora_only && 'Fedora 44 only (.rpm), install-checked on a clean Fedora 44 runner' || 'Ubuntu, Fedora and Windows, install-checked on clean Ubuntu 22.04/24.04, Fedora 44 and Windows runners' }}
        run: |
          cat > notes.md <<NOTES
          **Development build** for testing.

          - Built from \`$GITHUB_SHA\` and tested. Platforms: $PLATFORMS.
          - Installers are **not code-signed**: Windows SmartScreen will warn.
          - Updates: this dev build updates itself (over Tor, signed with the dev key) to later dev builds only; full releases never update to or from it.
          - Checksums: SHA256SUMS.
          NOTES
          gh release create "$DEV_TAG" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "SecureText dev build ($DEV_TAG)" --notes-file notes.md
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.dev_tag != ''
      # The dev channel's update feed. Signed here with the dev key, which
      # only dev builds trust (full releases trust only the offline key, and
      # their manifests name a different product), then posted to the
      # rolling "dev-channel" pre-release that dev builds read.
      - name: Sign and publish the dev update feed
        if: inputs.dev_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_KEY: ${{ secrets.UPDATE_SIGNING_KEY_DEV }}
          SECURETEXT_RELEASE_PASSPHRASE: ${{ secrets.UPDATE_SIGNING_PASSPHRASE_DEV }}
          VERSION: ${{ format('{0}-dev.{1}', needs.version.outputs.version, github.run_number) }}
        run: |
          umask 077
          printf '%s\n' "$DEV_KEY" > "$RUNNER_TEMP/dev.key"
          trap 'rm -f "$RUNNER_TEMP/dev.key"' EXIT
          args=()
          for f in dist/*; do
            case "$(basename "$f")" in
              SecureText_*.AppImage) args+=(--asset "linux-x86_64-appimage=$f") ;;
              SecureText_*_amd64.deb) args+=(--asset "linux-x86_64-deb=$f") ;;
              SecureText-*.x86_64.rpm) args+=(--asset "linux-x86_64-rpm=$f") ;;
              SecureText_*-setup.exe) args+=(--asset "windows-x86_64-nsis=$f") ;;
            esac
          done
          printf 'Dev build %s (commit %s).\n' "$VERSION" "${GITHUB_SHA:0:7}" > dev-notes.txt
          release() { cargo run --release -q -p securetext-update --bin securetext-release -- "$@"; }
          release manifest --channel dev --version "$VERSION" --notes-file dev-notes.txt \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$DEV_TAG" \
            "${args[@]}" --key-file "$RUNNER_TEMP/dev.key" --out securetext-update.json
          release verify securetext-update.json desktop/update-signing-dev.pub
          if ! gh release view dev-channel --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create dev-channel --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Dev channel (update feed)" \
              --notes "Holds the signed update manifest for dev builds; installed dev builds check it over Tor. Installers are on the individual dev-N releases."
          fi
          gh release upload dev-channel securetext-update.json --repo "$GITHUB_REPOSITORY" --clobber

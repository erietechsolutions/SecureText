[package]
name = "securetext-relay"
description = "SecureText offline-delivery relay (Tor onion service)"
version = "1.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "securetext-relay"
path = "src/main.rs"

[dependencies]
securetext-net = { path = "../securetext-net" }
rusqlite.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
snow.workspace = true
sha2.workspace = true
anyhow.workspace = true
thiserror.workspace = true

# Released relay packages are one fully static (musl) binary, so the same
# package runs on every supported host (Ubuntu Server 20.04 through Fedora
# 44) whatever its glibc and OpenSSL versions: `--features static` builds
# OpenSSL in instead of linking the system's. See scripts/build-relay-static.sh.
openssl = { version = "0.10", optional = true, features = ["vendored"] }

[features]
static = ["dep:openssl"]

[dev-dependencies]
tempfile.workspace = true

# `cargo deb -p securetext-relay` / `cargo generate-rpm -p crates/securetext-relay`
# (roadmap Phase 6: running a relay shouldn't need a Rust toolchain).
[package.metadata.deb]
maintainer = "erietechsolutions <erietechsolutions@users.noreply.github.com>"
copyright = "SecureText contributors"
extended-description = "A blind store-and-forward mailbox for SecureText, reachable only as a Tor onion service. It holds sealed, padded, anonymous message blobs for users who are offline and can read none of them."
section = "net"
priority = "optional"
assets = [
    ["target/release/securetext-relay", "usr/bin/", "755"],
    ["../../packaging/relay/securetext-relay.service", "lib/systemd/system/", "644"],
]
maintainer-scripts = "../../packaging/relay/debian"

[package.metadata.generate-rpm]
summary = "SecureText offline-delivery relay (Tor onion service)"
assets = [
    { source = "target/release/securetext-relay", dest = "/usr/bin/securetext-relay", mode = "755" },
    { source = "../../packaging/relay/securetext-relay.service", dest = "/usr/lib/systemd/system/securetext-relay.service", mode = "644" },
]
post_install_script = "systemctl daemon-reload >/dev/null 2>&1 || :; systemctl enable --now securetext-relay.service >/dev/null 2>&1 || :"
pre_uninstall_script = "if [ \"$1\" -eq 0 ]; then systemctl disable --now securetext-relay.service >/dev/null 2>&1 || :; fi"
post_uninstall_script = "systemctl daemon-reload >/dev/null 2>&1 || :"
